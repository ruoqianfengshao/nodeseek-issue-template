<!doctype html>
<!-- PROTOTYPE — Metal Slug rescue-result value card, fixed 600 × 275 export canvas. -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>合金弹头 · 人质救援结算卡原型</title>
  <style>
    :root{--ink:#10130f;--paper:#e8e3c9;--amber:#ffd14f;--orange:#ea8d2f;--red:#d24d38;--olive:#7d8762}
    *{box-sizing:border-box}body{margin:0;background:#292929;color:#fff;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}.controls{position:sticky;top:0;height:100vh;overflow:auto;padding:24px;background:#efeee8;color:#222}.controls h1{margin:0;font-size:20px}.controls p{color:#666}.controls section{display:grid;gap:9px;margin:18px 0}.controls h2{margin:0;font-size:13px}.controls label{display:grid;gap:4px;font-size:12px}.controls input,.controls select{width:100%;border:2px solid #555;padding:8px;background:#fff;color:#222;font:inherit}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stage{display:grid;min-width:0;place-items:center;overflow:auto;padding:44px;background:#4e4e4e}.export-wrap{width:600px}.export-note{margin:0 0 9px;color:#eee;font-size:13px;font-weight:700}
    .card{position:relative;width:600px;height:275px;overflow:hidden;border-radius:24px;background:#8bcdef}.scene{position:absolute;inset:0;width:100%;height:100%;border-radius:24px;object-fit:cover;filter:brightness(1.04) saturate(1.05);transform:scale(1.02)}.veil{position:absolute;inset:0;border-radius:24px;background:linear-gradient(135deg,rgba(72,192,255,.08),rgba(255,255,255,.03) 48%,rgba(255,182,127,.08))}.frame,.hazard,.rescue,.hostage,.speech,.shell,.refraction{display:none}.panel{position:absolute;inset:0;overflow:hidden;border:1px solid rgba(255,255,255,.56);border-radius:24px;background:rgba(255,255,255,.1);backdrop-filter:blur(4px) saturate(160%);-webkit-backdrop-filter:blur(4px) saturate(160%);padding:18px 24px;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.34);text-shadow:0 1px 2px rgba(7,42,67,.58),0 0 1px rgba(7,42,67,.68)}.panel:before{position:absolute;top:0;right:0;left:0;height:4px;content:"";background:linear-gradient(90deg,#83e7ff,#fff19a 48%,#ffb3d5)}.panel:after{display:none}.head{display:flex;align-items:center;justify-content:space-between;height:48px}.head b{display:block;color:#fff;font:800 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.03em}.head strong{display:block;margin-top:3px;color:#fff36b;font:800 30px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-shadow:0 1px 2px rgba(80,50,0,.58)}.date{position:static;padding:0;color:#fff;font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:right}.date span{display:block;margin-top:4px;color:#7eeaff;font-size:14px;text-shadow:0 1px 2px rgba(0,67,93,.68)}.rows{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}.row{display:flex;min-width:0;height:69px;padding:11px 13px;border:1px solid rgba(255,255,255,.35);border-radius:14px;background:rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.24);flex-direction:column;align-items:flex-start;justify-content:center;font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.row span{color:#fff}.row b{max-width:100%;margin-top:5px;overflow:hidden;color:#fff069;font-size:15px;white-space:nowrap;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(80,50,0,.6)}.row:nth-child(2) b{color:#73eaff;text-shadow:0 1px 2px rgba(0,67,93,.7)}.row:nth-child(3) b{color:#91ffb2;text-shadow:0 1px 2px rgba(0,74,37,.7)}.row b.good{color:#91ffb2}.row b.white{color:#73eaff}.insights{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}.insight{display:flex;align-items:center;justify-content:space-between;min-width:0;padding:7px 13px;border-radius:12px;background:rgba(255,255,255,.13);color:#fff;font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.insight b{color:#fff069;font-size:15px;text-shadow:0 1px 2px rgba(80,50,0,.6)}.insight:nth-child(2) b{color:#91ffb2;text-shadow:0 1px 2px rgba(0,74,37,.7)}.total{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:21px;padding:7px 1px 0;border:0;border-top:1px solid rgba(255,255,255,.35);background:none;color:#fff;font:800 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.total strong{color:#ff95ca;font-size:21px;text-align:right;text-shadow:0 1px 2px rgba(105,0,55,.68)}.switch{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:8px 12px;border-radius:999px;background:#111;color:#fff;font-size:12px;box-shadow:0 4px 16px #0008}@media(max-width:900px){.app{display:block}.controls{position:static;width:auto;height:auto}.stage{place-items:start;padding:25px}}
  </style>
</head>
<body>
  <main class="app"><aside class="controls"><h1>自定义背景 · 剩余价值卡</h1><p>原型：任意背景图下叠加同一套半透明白色结算面板。</p><section><h2>自定义背景</h2><label>选择图片<input id="background" type="file" accept="image/*"></label><p>仅本地预览；正式版将把选择的背景保存到浏览器本地。</p></section><section><h2>计算数据</h2><label>续费金额<input id="amount" type="number" value="10" step="0.01"></label><div class="grid2"><label>币种<select id="currency"><option value="USD">USD</option><option value="CNY">CNY</option></select></label><label>续费周期<select id="cycle"><option value="月付" data-days="31">月付</option><option value="季付" data-days="91">季付</option></select></label></div><div class="grid2"><label>剩余天数<input id="days" type="number" value="12"></label><label>周期天数<input id="cycleDays" type="number" value="31"></label></div><label>今日汇率<input id="rate" type="number" value="6.78234" step="0.00001"></label><label>预出总价（CNY）<input id="asking" type="number" value="1800" step="0.01"></label></section><section><h2>日期</h2><label>到期日期<input id="expiry" value="2026-08-08"></label><label>价值计算日期<input id="trade" value="2026-07-31"></label></section></aside>
  <section class="stage"><section class="export-wrap"><p class="export-note">导出预览 · 600 × 275 · 原型：自定义背景结算</p><article class="card"><img class="scene" src="file:///private/var/folders/8l/t33mf2515qnfb191x7bf3jpm0000gn/T/codex-clipboard-433f8220-8daa-478b-8720-febdaf8a8917.png" alt=""><i class="veil"></i><i class="frame"></i><i class="hazard"></i><div class="rescue"><i></i>MISSION COMPLETE</div><img class="hostage" src="file:///private/var/folders/8l/t33mf2515qnfb191x7bf3jpm0000gn/T/codex-clipboard-0de15ae4-98b4-4967-bf22-b38bd0d8e256.png" alt=""><div class="speech">THANK YOU!</div><section class="panel"><div class="head"><div><b>剩余价值</b><strong data-value>¥26.25</strong></div><div class="date">价值计算日期 <span data-trade>2026-07-31</span></div></div><div class="rows"><div class="row"><span>续费金额 / 周期</span><b data-renewal>$10.00 / 月付</b></div><div class="row"><span>到期日期</span><b data-expiry>2026-08-08</b></div><div class="row"><span>剩余天数</span><b class="white" data-days>12 天</b></div></div><div class="insights"><div class="insight"><span>剩余百分比</span><b data-percent>38.7%</b></div><div class="insight"><span>今日汇率</span><b data-rate>$1 = ¥6.78234</b></div></div><div class="total"><span>价格预览</span><strong data-price>溢价 ¥1773.75</strong></div></section><i class="shell">•</i></article></section></section></main><div class="switch">原型 A · 自定义背景结算</div>
  <script>const $=id=>document.getElementById(id),q=s=>document.querySelector(s),qa=s=>document.querySelectorAll(s);let backgroundUrl='';function render(){const amount=Number($('amount').value)||0,days=Math.max(0,Number($('days').value)||0),cycleDays=Math.max(1,Number($('cycleDays').value)||1),rate=Number($('rate').value)||1,asking=Number($('asking').value),currency=$('currency').value,value=amount*days/cycleDays*rate,prefix=currency==='CNY'?'¥':'$';q('[data-value]').textContent=`¥${value.toFixed(2)}`;q('[data-trade]').textContent=$('trade').value||'—';q('[data-renewal]').textContent=`${prefix}${amount.toFixed(2)} / ${$('cycle').value}`;q('[data-expiry]').textContent=$('expiry').value||'—';q('[data-days]').textContent=`${days} 天`;q('[data-percent]').textContent=`${Math.min(100,days/cycleDays*100).toFixed(1)}%`;q('[data-rate]').textContent=currency==='CNY'?'人民币计价':`$1 = ¥${rate.toFixed(5)}`;const premium=asking-value;q('[data-price]').textContent=!Number.isFinite(asking)?'待填总价':premium>0?`溢价 ¥${premium.toFixed(2)}`:premium===0?'剩余价值出':`${(asking/value*10).toFixed(1)} 折`}qa('input,select').forEach(e=>e.addEventListener('input',render));$('cycle').addEventListener('change',e=>{$('cycleDays').value=e.target.selectedOptions[0].dataset.days;render()});$('background').addEventListener('change',event=>{const file=event.target.files[0];if(!file)return;if(backgroundUrl)URL.revokeObjectURL(backgroundUrl);backgroundUrl=URL.createObjectURL(file);q('.scene').src=backgroundUrl});render();</script>
</body></html>
